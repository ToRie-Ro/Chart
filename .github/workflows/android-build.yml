name: Android Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore Gradle dependencies
        working-directory: android/SabayChat-Android
        run: ./gradlew dependencies

      - name: Build debug APK
        working-directory: android/SabayChat-Android
        run: ./gradlew assembleDebug

      - name: Build release APK
        working-directory: android/SabayChat-Android
        run: ./gradlew assembleRelease

      - name: Build release AAB
        working-directory: android/SabayChat-Android
        run: ./gradlew bundleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SabayChat-release.apk
          path: android/SabayChat-Android/app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: SabayChat-release.aab
          path: android/SabayChat-Android/app/build/outputs/bundle/release/app-release.aab
