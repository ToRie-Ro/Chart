name: Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle runtime
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle-8.13-bin.zip
          unzip -o /tmp/gradle-8.13-bin.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> $GITHUB_PATH

      - name: Generate Gradle wrapper if missing
        working-directory: android/SabayChat-Android
        run: |
          if [ ! -f gradlew ]; then
            /tmp/gradle-8.13/bin/gradle wrapper --gradle-version 8.13
          fi
          chmod +x ./gradlew

      - name: Restore Gradle dependencies
        working-directory: android/SabayChat-Android
        run: ./gradlew dependencies

      - name: Build debug APK
        working-directory: android/SabayChat-Android
        run: ./gradlew assembleDebug

      - name: Build release APK
        working-directory: android/SabayChat-Android
        run: ./gradlew assembleRelease

      - name: Build release AAB
        working-directory: android/SabayChat-Android
        run: ./gradlew bundleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SabayChart-debug.apk
          path: android/SabayChat-Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: SabayChat-release.aab
          path: android/SabayChat-Android/app/build/outputs/bundle/release/app-release.aab
