name: iOS Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Validate Xcode project exists
        run: |
          if [ ! -f ios/SabayChat-iOS/SabayChat-iOS.xcodeproj/project.pbxproj ]; then
            echo "The SabayChat-iOS Xcode project is missing."
            exit 1
          fi

      - name: Select Xcode version
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app

      - name: Resolve Swift packages
        working-directory: ios/SabayChat-iOS
        run: xcodebuild -project SabayChat-iOS.xcodeproj -scheme SabayChat-iOS -resolvePackageDependencies

      - name: Build iOS app
        working-directory: ios/SabayChat-iOS
        run: |
          set -e
          xcodebuild -project SabayChat-iOS.xcodeproj -scheme SabayChat-iOS -configuration Release -sdk iphoneos -archivePath build/SabayChart.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: Verify iOS archive
        working-directory: ios/SabayChat-iOS
        run: |
          set -e
          if [ ! -d build/SabayChart.xcarchive ]; then
            echo "Archive was not created."
            exit 1
          fi
          find build/SabayChart.xcarchive -type d -name '*.app' -print

      - name: Export IPA
        working-directory: ios/SabayChat-iOS
        run: |
          set -e
          rm -rf build/Payload build/SabayChart.ipa
          mkdir -p build/Payload
          APP_PATH=$(find build/SabayChart.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle was found in the archive."
            exit 1
          fi
          cp -R "$APP_PATH" build/Payload/
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/SabayChart.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SabayChart.ipa
          path: ios/SabayChat-iOS/build/SabayChart.ipa
          if-no-files-found: error
