name: iOS Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Validate Xcode project exists
        id: xcode_project
        run: |
          if [ ! -d ios/SabayChat-iOS ] || ! find ios/SabayChat-iOS -maxdepth 1 \( -name '*.xcodeproj' -o -name '*.xcworkspace' \) | grep -q .; then
            echo "No Xcode project or workspace found at ios/SabayChat-iOS; skipping iOS build."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Select Xcode version
        if: steps.xcode_project.outputs.available == 'true'
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app

      - name: Resolve Swift packages
        if: steps.xcode_project.outputs.available == 'true'
        working-directory: ios/SabayChat-iOS
        run: xcodebuild -resolvePackageDependencies

      - name: Build iOS app
        if: steps.xcode_project.outputs.available == 'true'
        working-directory: ios/SabayChat-iOS
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e
          echo "Signing configuration is configured through GitHub Secrets."
          xcodebuild -scheme SabayChat-iOS -configuration Release -sdk iphoneos -archivePath build/SabayChat.xcarchive archive

      - name: Export IPA
        if: steps.xcode_project.outputs.available == 'true'
        working-directory: ios/SabayChat-iOS
        run: |
          xcodebuild -exportArchive -archivePath build/SabayChat.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build

      - name: Upload IPA artifact
        if: steps.xcode_project.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SabayChat.ipa
          path: ios/SabayChat-iOS/build/*.ipa
