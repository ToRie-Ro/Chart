name: iOS Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app

      - name: Resolve Swift packages
        working-directory: ios/SabayChat-iOS
        run: xcodebuild -resolvePackageDependencies

      - name: Build iOS app
        working-directory: ios/SabayChat-iOS
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e
          echo "Signing configuration is configured through GitHub Secrets."
          xcodebuild -scheme SabayChat-iOS -configuration Release -sdk iphoneos -archivePath build/SabayChat.xcarchive archive

      - name: Export IPA
        working-directory: ios/SabayChat-iOS
        run: |
          xcodebuild -exportArchive -archivePath build/SabayChat.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SabayChat.ipa
          path: ios/SabayChat-iOS/build/*.ipa
