name: iOS Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Validate Xcode project exists
        run: |
          if [ ! -f ios/SabayChat-iOS/SabayChat-iOS.xcodeproj/project.pbxproj ]; then
            echo "The SabayChat-iOS Xcode project is missing."
            exit 1
          fi

      - name: Select Xcode version
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app

      - name: Resolve Swift packages
        working-directory: ios/SabayChat-iOS
        run: xcodebuild -project SabayChat-iOS.xcodeproj -scheme SabayChat-iOS -resolvePackageDependencies

      - name: Build iOS app
        working-directory: ios/SabayChat-iOS
        run: xcodebuild -project SabayChat-iOS.xcodeproj -scheme SabayChat-iOS -configuration Release -sdk iphoneos -archivePath build/SabayChat.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Export IPA
        working-directory: ios/SabayChat-iOS
        run: |
          set -e
          rm -rf build/Payload build/SabayChat.ipa
          mkdir -p build/Payload
          cp -R build/SabayChat.xcarchive/Products/Applications/SabayChat-iOS.app build/Payload/
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/SabayChat.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SabayChat.ipa
          path: ios/SabayChat-iOS/build/SabayChat.ipa
          if-no-files-found: error
