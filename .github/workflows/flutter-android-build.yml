name: Flutter Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Backend URL used by the Flutter app
        required: true
        default: https://chart-ztyk.onrender.com
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        working-directory: flutter/sabaychat_flutter
        run: |
          flutter create . --platforms=android --project-name sabaychart
          mkdir -p assets
          cp ../../ios/SabayChat-iOS/Assets.xcassets/AppIcon.appiconset/AppIcon.png assets/app_icon.png
          sed -i -e 's/android:label="sabaychat_flutter"/android:label="SabayChart"/' -e 's/android:label="sabaychart"/android:label="SabayChart"/' android/app/src/main/AndroidManifest.xml

      - name: Install Flutter dependencies
        working-directory: flutter/sabaychat_flutter
        run: flutter pub get

      - name: Generate SabayChart app icon
        working-directory: flutter/sabaychat_flutter
        run: dart run flutter_launcher_icons

      - name: Analyze Flutter source
        working-directory: flutter/sabaychat_flutter
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: flutter/sabaychat_flutter
        run: flutter test

      - name: Build release APK
        working-directory: flutter/sabaychat_flutter
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ inputs.api_base_url }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SabayChat-flutter-release-apk
          path: flutter/sabaychat_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
